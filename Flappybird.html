<!DOCTYPE html>
<html>
<head>
  <title>Flappy Bird in HTML/JS</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #70c5ce;
    }
  
    canvas {
      display: block;
      margin: 0 auto;
      /* Remove: background:#70c5ce; */
      background: transparent;
    }
  
    body {
      margin: 0;
      overflow: hidden;
      /* Optionally keep body background as fallback: background:#70c5ce; */
    }

    #score { 
      position: absolute; 
      top: 20px; 
      left: 50%; 
      transform: translateX(-50%);
      color: #fff; 
      font: bold 32px Arial, sans-serif; 
      text-shadow: 2px 2px 4px #333;
      z-index: 2;
    }
  </style>
</head>
<body>
<div id="score">0</div>
<canvas id="game" width="400" height="600"></canvas>
<script>
const birdImg = new Image();
birdImg.src = "71hs-euA1xL._AC_UF894,1000_QL80_ (1).png";
const bgImg = new Image();
bgImg.src = "https://ejfoundation.org/imager/media/50062/sharks1_d3867277feb154defec9b24a5714fadb.png";  // Replace with your image path (e.g., flappy-bg.jpg, ideally 400x600)
let gameStarted = false;
bgImg.onload = () => {
  gameStarted = true;
}
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreDiv = document.getElementById('score');

const GRAVITY = 0.2;
const FLAP = -6;
const PIPE_WIDTH = 60;
const PIPE_GAP = 300;
const BIRD_SIZE = 60;

let bird = { x: 80, y: 250, velocity: 0 };
let pipes = [];
let score = 0;
let gameOver = false;

function resetGame() {
  bird = { x: 80, y: 250, velocity: 0 };
  pipes = [];
  score = 0;
  gameOver = false;
  scoreDiv.textContent = score;
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(Math.min(bird.velocity / 10, Math.PI/12));
 ctx.drawImage(birdImg,-BIRD_SIZE,-BIRD_SIZE,BIRD_SIZE, BIRD_SIZE/1.5);
  ctx.restore();
}

function drawPipe(pipe) {
  ctx.fillStyle = '#228B22';
  // Top pipe
  ctx.fillRect(pipe.x, 0, PIPE_WIDTH, pipe.top);
  // Bottom pipe
  ctx.fillRect(pipe.x, pipe.top + PIPE_GAP, PIPE_WIDTH, canvas.height - pipe.top - PIPE_GAP);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
  drawBird();
  pipes.forEach(drawPipe);
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('GG la you :D', canvas.width/2, canvas.height/2 - 40);
    ctx.font = 'bold 24px Arial';
    ctx.fillText('Press Space to Revive Haj :D', canvas.width/2, canvas.height/2 + 20);
  }
}

function flap() {
  if (!gameOver) {
    bird.velocity = FLAP;
  } else {
    resetGame();
  }
}

document.addEventListener('keydown', function(e) {
  if (e.code === 'Space') flap();
});

canvas.addEventListener('mousedown', flap);

function update() {
   if (!gameStarted) {
    requestAnimationFrame(update);
    return;
  }
  if (!gameOver) {
    bird.velocity += GRAVITY;
    bird.y += bird.velocity;
    // Add pipes
    if (pipes.length === 0 || pipes[pipes.length-1].x < canvas.width - 200) {
      let top = Math.random() * (canvas.height - PIPE_GAP - 80) + 40;
      pipes.push({ x: canvas.width, top: top, passed: false });
    }
    // Move pipes
    pipes.forEach(pipe => pipe.x -= 2);
    // Remove off-screen pipes
    if (pipes.length && pipes[0].x < -PIPE_WIDTH) pipes.shift();
    // Collision detection
    pipes.forEach(pipe => {
      // Bird hits pipe
      if (
        bird.x + BIRD_SIZE/3> pipe.x &&
        bird.x - BIRD_SIZE/1.5 < pipe.x + PIPE_WIDTH &&
        (bird.y - BIRD_SIZE/1.8 < pipe.top || bird.y/1.2 + BIRD_SIZE > pipe.top + PIPE_GAP)
      ) {
        gameOver = true;
      }
      // Score
      if (!pipe.passed && pipe.x + PIPE_WIDTH < bird.x) {
        score++;
        pipe.passed = true;
        scoreDiv.textContent = score;
      }
    });
    // Bird hits ground or ceiling
    if (bird.y + BIRD_SIZE/2 > canvas.height || bird.y - BIRD_SIZE/2 < 0) {
      gameOver = true;
    }
  }
  draw();
  requestAnimationFrame(update);
}

resetGame();
update();
</script>
</body>
</html>
