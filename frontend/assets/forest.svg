<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" preserveAspectRatio="xMidYMid slice"><style>
/* Only opacity and small transforms change; no script or animated filters. */
.star-field{animation:twinkle 5.6s ease-in-out infinite alternate}
.stars-b{animation-duration:7.3s;animation-delay:-3.1s}
.stars-c{animation-duration:4.7s;animation-delay:-1.8s}
.moon{animation:moon-drift 22s ease-in-out infinite alternate}
.trees-back{transform-origin:700px 700px;animation:canopy 13s ease-in-out infinite alternate}
.trees-front{transform-origin:700px 700px;animation:canopy 17s ease-in-out -6s infinite alternate-reverse}
@keyframes twinkle{0%,15%{opacity:.2}80%,100%{opacity:.85}}
@keyframes moon-drift{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes canopy{from{transform:rotate(-.18deg)}to{transform:rotate(.18deg)}}
@media(prefers-reduced-motion:reduce){.star-field,.moon,.trees-back,.trees-front{animation:none}.star-field{opacity:.6}}
</style><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#192a2b"/><stop offset="1" stop-color="#0a1215"/></linearGradient><radialGradient id="glow"><stop stop-color="#aebca1" stop-opacity=".2"/><stop offset="1" stop-color="#aebca1" stop-opacity="0"/></radialGradient><linearGradient id="fog" x2="0" y2="1"><stop stop-color="#718786" stop-opacity="0"/><stop offset=".5" stop-color="#718786" stop-opacity=".16"/><stop offset="1" stop-color="#0a1215" stop-opacity="0"/></linearGradient><g id="pine"><path d="M0 0-18 68-10 65-35 119-22 115-50 178-29 171-64 241H64L29 171l21 7-28-63 13 4-25-54 8 3Z"/><path d="M-5 220H5v75H-5Z"/></g></defs><path fill="url(#sky)" d="M0 0h1400v700H0z"/><g class="moon"><ellipse cx="920" cy="180" rx="340" ry="290" fill="url(#glow)"/><circle cx="920" cy="164" r="66" fill="#d3d3b9" opacity=".8"/><circle cx="903" cy="143" r="17" fill="#b7bba6" opacity=".25"/><circle cx="940" cy="184" r="25" fill="#a5ad9e" opacity=".22"/></g><g class="star-field" fill="#d4e1d4" opacity=".6"><circle cx="640" cy="55" r="1"/><circle cx="1100" cy="89" r="1.4"/><circle cx="520" cy="157" r="1"/><circle cx="1240" cy="44" r="1"/><circle cx="827" cy="73" r="1"/><circle cx="1020" cy="283" r="1"/><circle cx="334" cy="62" r="1"/></g><g class="star-field stars-b" fill="#d9dcc2" opacity=".5"><circle cx="725" cy="113" r="1.5"/><circle cx="1190" cy="205" r="1.7"/><circle cx="440" cy="88" r="1.2"/><circle cx="1310" cy="110" r="1.5"/><circle cx="1015" cy="45" r="1.2"/><circle cx="585" cy="224" r="1.3"/></g><g class="star-field stars-c" fill="#bed1cf" opacity=".4"><circle cx="780" cy="28" r="1.3"/><circle cx="1125" cy="165" r="1.1"/><circle cx="376" cy="178" r="1.4"/><circle cx="680" cy="240" r="1.2"/><circle cx="1350" cy="52" r="1.5"/><circle cx="1210" cy="310" r="1.1"/></g><path d="M0 404 134 300 235 373 400 260 540 347 690 311 834 384 1001 270 1140 363 1301 274 1400 357V700H0Z" fill="#223638" opacity=".6"/><g class="trees-back" fill="#172b2d"><use href="#pine" transform="translate(50 290) scale(1.1)"/><use href="#pine" transform="translate(180 280) scale(1.2)"/><use href="#pine" transform="translate(310 325)"/><use href="#pine" transform="translate(465 270) scale(1.3)"/><use href="#pine" transform="translate(620 335)"/><use href="#pine" transform="translate(760 290) scale(1.2)"/><use href="#pine" transform="translate(940 310) scale(1.2)"/><use href="#pine" transform="translate(1100 260) scale(1.4)"/><use href="#pine" transform="translate(1270 290) scale(1.3)"/><use href="#pine" transform="translate(1390 260) scale(1.4)"/></g><path fill="url(#fog)" d="M0 340h1400v280H0z"/><g class="trees-front" fill="#0c1b1e"><use href="#pine" transform="translate(-20 130) scale(2.2)"/><use href="#pine" transform="translate(160 220) scale(1.8)"/><use href="#pine" transform="translate(350 350) scale(1.4)"/><use href="#pine" transform="translate(600 400) scale(1.2)"/><use href="#pine" transform="translate(810 375) scale(1.4)"/><use href="#pine" transform="translate(1020 325) scale(1.6)"/><use href="#pine" transform="translate(1250 190) scale(2.1)"/><use href="#pine" transform="translate(1440 120) scale(2.3)"/></g><path d="M0 600Q300 510 550 590t500-30 350 40v100H0Z" fill="#091215"/></svg>
