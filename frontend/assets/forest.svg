<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" preserveAspectRatio="xMidYMid slice"><style>
/* Only opacity and small transforms change; no script or animated filters. */
.star-field{animation:twinkle 5.6s ease-in-out infinite alternate}
.stars-b{animation-duration:7.3s;animation-delay:-3.1s}
.stars-c{animation-duration:4.7s;animation-delay:-1.8s}
.moon{animation:moon-drift 22s ease-in-out infinite alternate}
.trees-back{transform-origin:700px 700px;animation:canopy 13s ease-in-out infinite alternate}
.trees-front{transform-origin:700px 700px;animation:canopy 17s ease-in-out -6s infinite alternate-reverse}
@keyframes twinkle{0%,15%{opacity:.2}80%,100%{opacity:.85}}
@keyframes moon-drift{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes canopy{from{transform:rotate(-.18deg)}to{transform:rotate(.18deg)}}
@media(prefers-reduced-motion:reduce){.star-field,.moon,.trees-back,.trees-front{animation:none}.star-field{opacity:.6}}
</style><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#192a2b"/><stop offset="1" stop-color="#0a1215"/></linearGradient><radialGradient id="glow"><stop stop-color="#aebca1" stop-opacity=".2"/><stop offset="1" stop-color="#aebca1" stop-opacity="0"/></radialGradient><linearGradient id="fog" x2="0" y2="1"><stop stop-color="#718786" stop-opacity="0"/><stop offset=".5" stop-color="#718786" stop-opacity=".16"/><stop offset="1" stop-color="#0a1215" stop-opacity="0"/></linearGradient><radialGradient id="moon-surface" cx=".32" cy=".24" r=".85"><stop stop-color="#e4e0c8"/><stop offset=".55" stop-color="#b8bda9"/><stop offset="1" stop-color="#82968e"/></radialGradient><radialGradient id="moon-rim-glow"><stop offset=".7" stop-color="#dedfc0" stop-opacity="0"/><stop offset=".78" stop-color="#e7dfb9" stop-opacity=".38"/><stop offset=".86" stop-color="#d0d7b8" stop-opacity=".12"/><stop offset="1" stop-color="#d0d7b8" stop-opacity="0"/></radialGradient><clipPath id="moon-surface-mask"><circle cx="920" cy="164" r="65.5"/></clipPath><g id="pine"><path d="M0 0-18 68-10 65-35 119-22 115-50 178-29 171-64 241H64L29 171l21 7-28-63 13 4-25-54 8 3Z"/><path d="M-5 220H5v75H-5Z"/></g></defs><path fill="url(#sky)" d="M0 0h1400v700H0z"/><g class="moon"><ellipse cx="920" cy="180" rx="340" ry="290" fill="url(#glow)"/><circle cx="920" cy="164" r="84" fill="url(#moon-rim-glow)"/><circle cx="920" cy="164" r="66" fill="url(#moon-surface)"/><g clip-path="url(#moon-surface-mask)"><path d="M879 136q12-21 30-14t10 26q-4 10-15 6t-11 12q-13 2-18-7t4-23ZM925 169q19-14 32 2t5 30q-16 17-31 3t-6-35Z" fill="#637d78" opacity=".19"/><g fill="#6f857c" fill-opacity=".24" stroke="#edf0d3" stroke-opacity=".18" stroke-width="1.2"><circle cx="889" cy="171" r="10"/><circle cx="929" cy="122" r="7"/><circle cx="951" cy="153" r="9"/><circle cx="906" cy="200" r="12"/><circle cx="913" cy="169" r="5"/><circle cx="970" cy="183" r="6"/><circle cx="885" cy="145" r="3"/></g><g fill="#f0ecd0" opacity=".3"><circle 